<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Blue circle background -->
  <circle cx="256" cy="256" r="250" fill="#1565C0"/>
  <circle cx="256" cy="256" r="235" fill="none" stroke="#1976D2" stroke-width="4"/>

  <!-- White "N" letter - bold, modern -->
  <text x="256" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="280" font-weight="bold" fill="white" letter-spacing="-10">N</text>

  <!-- Small medical cross element at top-right -->
  <g transform="translate(380, 120)">
    <rect x="-8" y="-20" width="16" height="40" rx="3" fill="white" opacity="0.9"/>
    <rect x="-20" y="-8" width="40" height="16" rx="3" fill="white" opacity="0.9"/>
  </g>

  <!-- Subtle eye symbol at bottom -->
  <g transform="translate(256, 430)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="30" ry="16" fill="none" stroke="white" stroke-width="3"/>
    <circle cx="0" cy="0" r="7" fill="white"/>
  </g>
</svg>
